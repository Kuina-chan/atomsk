name: Atomsk-MacOS-M-build

on:
  workflow_dispatch:
  push:
    paths:
      -'.github/workflows/build-macos.yml'
      -'src/**'

jobs:
  build-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: install gfortran
        run: |
          brew install gcc

      - name: Compile for arm64
        working-directory: src
        run: |
          cat << 'EOF' > Makefile.macos
          export
          FORTRAN=gfortran
          FFLAGS=-O2 -fopenmp
          LAPACK=-framework Accelerate
          include Makefile
          EOF
          make -f Makefile.macos atomsk

      - name: Verification
        working-directory: src
        run: |
          file atomsk
          otool -L atomsk

      - name: Finishing the binary
        uses: actions/upload-artifact@v4
        with:
          name: atomsk-macos-M-series
          path: src/atomsk